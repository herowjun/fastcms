spring:
  application:
    name: fastcms
  profiles:
    active: dev
  cache:
    type: ehcache
  freemarker:
    checkTemplateLocation: false


  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/fastcms?autoReconnect=true&useSSL=false&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

mybatis-plus:
  global-config:
    banner: false
  mapper-locations: classpath*:/mapper/*Mapper.xml

fastcms:
  plugin:
    # 测试环境从插件工程源码目录加载插件（DEVELOPMENT 模式，免打包调试）
    path: ../plugins
    mode: DEVELOPMENT
  auth:
    token:
      expire:
        seconds: 18000
      secret-key: SecretKey012345678901234567890123456789012345678901234567890123456789




