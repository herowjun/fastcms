spring:
  application:
    name: fastcms
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  cache:
    type: jcache
    jcache:
      config: classpath:ehcache.xml
  freemarker:
    checkTemplateLocation: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3308/fastcms?autoReconnect=true&useSSL=false&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

mybatis-plus:
  global-config:
    banner: false
  mapper-locations: classpath*:/mapper/*Mapper.xml

fastcms:
  auth:
    token:
      expire:
        seconds: 18000
      secret-key: SecretKey012345678901234567890123456789012345678901234567890123456789
  security:
    ignore:
      urls: "/fastcms/api/admin/login,\
      /fastcms/api/admin/register,\
      /fastcms/api/admin/reset/password,\
      /fastcms/api/admin/config/public/list,\
      /fastcms/api/admin/captcha,\
      /fastcms/api/install/status,\
      /fastcms/api/install/test-connection,\
      /fastcms/api/install/execute,\
      /fastcms/api/client/wechat/miniapp/user/code2session,\
      /fastcms/api/client/wechat/miniapp/user/login,\
      /fastcms/api/client/wechat/miniapp/user/login/phone,\
      /fastcms/websocket/**"
  config:
    ignore:
      keys: "wechat_mch_secret"
  mybatis:
    ignore:
      mappedStatementIds: "selectById, selectBatchIds, getArticleById, pageArticleZan, com.fastcms.cms.mapper.ArticleCategoryMapper.selectList"
  ai:
    template:
      # 设计稿先行模式（design 模式）开关：开启后"AI 新建模板"对话框出现生成模式选择；
      # 关闭（生产默认）时前端隐藏选项、后端拒绝 design 会话，等价于功能不存在
      design:
        enabled: true
        # max-audit-runs: 2              # 审计→修正轮上限（仍失败进人工确认）
        # max-format-rounds: 3           # 设计稿格式校验（V1~V6）轮上限
        # design-max-tokens: 24000       # 单页设计稿输出 token 上限
        # section-confidence-threshold: 0.7  # 组件映射置信阈值（低于→custom_macro）

logging:
  config: classpath:META-INF/logback/fastcms.xml

server:
  servlet:
    encoding:
      force: true
