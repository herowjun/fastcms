<#macro header title>
<!DOCTYPE html>
<html lang='zh-CN'>
<head>
<meta charset='utf-8'>
<title>${title!''}</title>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<meta name='keywords' content="${seoTag('website_title')!''}">
<meta name='description' content="${seoTag('website_sub_title')!''}">
<link href='${ctx()}/css/base.css' rel='stylesheet'>
<#nested/>
</head>
</#macro>
<#macro body>
<body>
<header class='site-header'>
 <div class='container header-inner'>
 <div class='logo'><a href='/'>科技蓝</a></div>
 <nav class='site-nav' aria-label='主导航'>
 <ul>
 <li><a href='/'>首页</a></li>
 <@menuTag>
 <#if data?? && (data?size >0)>
 <#list data as item>
 <li><a href='${(item.url)!}' target="${(item.target!'_self')}">${(item.menuName)!}</a></li>
 </#list>
 </#if>
 </@menuTag>
 </ul>
 </nav>
 </div>
</header>
<#nested/>
<footer class='site-footer'>
 <div class='container'>
 <p>Copyright © ${.now?string('yyyy')} - Powered by Fastcms</p>
 </div>
</footer>
</#macro>
<#macro script>
<#nested/>
</body>
</html>
</#macro>
